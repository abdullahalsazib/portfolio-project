<nav class="fixed w-full top-0 z-50 backdrop-blur-xl" [@slideInDown]>
  <div class="container max-w-7xl mx-auto px-4">
    <div class="flex items-center justify-between h-16">
      <button
        (click)="toggleTheme()"
        class="md:hidden w-10 h-10 rounded-full flex items-center justify-center duration-300 text-black dark:text-white hover:text-blue-400"
      >
        <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
      </button>
      <!-- Logo and Brand -->
      <div class="flex items-center">
        <a routerLink="/" class="text-black dark:text-white font-bold text-xl sm:text-2xl"
          >Abdullah.</a
        >
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-6" [@staggerFadeIn]>
        <ul class="flex items-center justify-center gap-2">
          <li *ngFor="let item of navlink" class="relative" [@fadeIn]>
            <a
              [routerLink]="item.link"
              routerLinkActive="!text-blue-400 "
              class="text-sm capitalize font-medium text-gray-600 dark:text-white/50 dark:hover:text-white hover:text-gray-950 transition-all duration-300 ease-in-out py-2 px-4 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800/50"
            >
              {{ item.title }}</a
            >
          </li>
          <a
            href="https://discord.com/users/@jack.sparrow_z"
            target="_blank"
            rel="noopener noreferrer"
            class="flex items-center gap-2 px-4 py-2 bg-gradient-to-r from-purple-600 to-blue-500 hover:from-purple-700 hover:to-blue-600 text-white rounded-lg transform hover:scale-105 transition-all duration-300 ease-in-out shadow-lg hover:shadow-xl hover:shadow-purple-500/50 text-sm font-semibold"
          >
            <i class="fab fa-discord text-lg"></i>
            Discord
          </a>
        </ul>

        <button
          (click)="toggleTheme()"
          class="w-10 h-10 rounded-full flex items-center justify-center duration-300 hover:bg-blue-500/50 dark:text-gray-300 text-black hover:text-black"
        >
          <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
        </button>
        <!-- Settings Icon with Dropdown - Desktop -->
        <div class="relative"></div>
      </div>

      <!-- Mobile Menu Button -->

      <div class="md:hidden">
        <button
          (click)="toggleMobileMenu()"
          class="dark:text-gray-300 text-black hover:text-black"
        >
          <i
            class="fas text-xl"
            [ngClass]="!isMobileMenuOpen ? 'fa-bars' : 'fa-close'"
          ></i>
          <!-- <i class="fas fa-close text-xl"></i> -->
        </button>
      </div>
    </div>

    <!-- Mobile Menu Dropdown -->
    <div *ngIf="isMobileMenuOpen" class="md:hidden w-full h py-10" [@slideInDown]>
      <ul class="flex items-center justify-center flex-col gap-10" [@staggerFadeIn]>
        <li *ngFor="let item of navlink" class="relative" [@fadeInUp]>
          <a
            [routerLink]="item.link"
            routerLinkActive="!text-blue-400 "
            class="text-sm text-center capitalize font-semibold text-gray-600 dark:text-white/80 dark:hover:text-white hover:text-gray-950 duration-300 py-2 px-5"
          >
            {{ item.title }}</a
          >
        </li>
        <a
          href="https://discord.com/users/@jack.sparrow_z"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center gap-2 px-5 py-2 bg-gradient-to-r from-purple-600 to-blue-500 hover:from-purple-700 hover:to-blue-600 text-white rounded-lg transform hover:scale-105 transition-all duration-300 shadow-lg hover:shadow-xl text-sm font-medium"
        >
          <i class="fab fa-discord text-lg"></i>
          Discord
        </a>
      </ul>
    </div>
  </div>
</nav>
