<main
  class="relative min-h-screen bg-gradient-to-b from-gray-100 to-white dark:from-gray-900 dark:to-black text-gray-900 dark:text-white overflow-hidden"
>
  <!-- Hero Section with 3D Effect -->
  <div
    class="container mx-auto px-4 py-16 relative min-h-screen flex items-center justify-center"
  >
    <!-- Background Text Layer -->
    <div
      class="absolute inset-0 overflow-hidden pointer-events-none select-none"
    >
      <!-- Random Text Elements - Added animate-bounce-slow class to each span -->
      <span
        style="rotate: -30deg"
        class="absolute top-1/7 left-1/9 text-9xl font-bold opacity-5 blur-[3px] text-red-800 dark:text-purple-400 animate-bounce-slow"
        >Angular</span
      >

      <span
        class="absolute top-2/3 right-1/5 text-8xl font-bold opacity-5 blur-[3px] rotate-[15deg] text-violet-600 dark:text-violet-400 animate-bounce-slow"
        >BANGLADESH</span
      >

      <span
        class="absolute top-1/2 right-1/3 text-8xl font-bold opacity-5 blur-[3px] rotate-[5deg] text-blue-600 dark:text-blue-400 animate-bounce-slow"
        >JavaScript</span
      >
      <span
        style="rotate: -30deg"
        class="absolute bottom-1/4 right-1 text-9xl font-bold opacity-5 blur-[5px] text-indigo-600 dark:text-indigo-100 animate-bounce-slow"
        >অপেক্ষা</span
      >
      <span
        class="absolute top-1/4 left-2/3 text-8xl font-bold opacity-5 blur-[3px] rotate-[25deg] text-violet-600 dark:text-violet-400 animate-bounce-slow"
        >GoLang</span
      >
      <span
        style="rotate: 20deg"
        class="absolute bottom-2/3 right-1/3 text-9xl font-bold opacity-5 blur-[3px] text-purple-600 dark:text-purple-400 animate-bounce-slow"
        >C++</span
      >
      <span
        class="absolute top-3/4 left-1/4 text-8xl font-bold opacity-5 blur-[3px] rotate-[12deg] text-blue-600 dark:text-blue-400 animate-bounce-slow"
        >অপেক্ষা</span
      >
      <span
        class="absolute bottom-1/4 right-1/2 text-9xl font-bold opacity-5 blur-[3px] rotate-[-15deg] text-indigo-600 dark:text-indigo-400 animate-bounce-slow"
        >CONST</span
      >

      <!-- SVG Elements - Added animate-bounce-slow to svg elements -->
    </div>

    <!-- Main Content -->
    <div class="relative z-10 flex flex-col items-center text-center" [@fadeIn]>
      <h1
        class="text-5xl sm:text-6xl md:text-7xl font-bold mb-6 relative"
        [@bounceIn]
      >
        <span
          class="bg-clip-text text-transparent bg-gradient-to-r from-violet-600 to-indigo-600 dark:from-violet-400 dark:via-purple-500 dark:to-indigo-500"
        >
          Abdullah Al Sazib
        </span>
        <span
          class="absolute -bottom-4 right-0 text-sm sm:text-base font-medium italic text-gray-500 dark:text-gray-400 transform rotate-[-5deg]"
        >
          Captain Jack Sparrow ☠️
        </span>
      </h1>
      <p
        class="text-lg sm:text-xl md:text-2xl mb-8 text-gray-600 dark:text-gray-300 font-medium"
        [@fadeInUp]
      >
        Web Designer & Developer
      </p>

      <!-- Animated Tech Stack -->
      <div class="flex flex-col items-center gap-6 mb-12 w-full" [@staggerFadeIn]>
        <!-- First Row -->
        <div class="flex flex-wrap justify-center items-center gap-6 w-full max-w-5xl">
          <i
            class="devicon-go-original text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #00ADD8;"
            [@fadeInUp]
            title="Golang"
          ></i>
          <i
            class="devicon-linux-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #FCC624;"
            [@fadeInUp]
            title="Linux"
          ></i>
          <i
            class="devicon-docker-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #2496ED;"
            [@fadeInUp]
            title="Docker"
          ></i>
          <i
            class="devicon-github-original text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #181717;"
            [@fadeInUp]
            title="GitHub"
          ></i>
          <i
            class="devicon-kubernetes-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #326CE5;"
            [@fadeInUp]
            title="Kubernetes"
          ></i>
          <i
            class="devicon-amazonwebservices-original text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #FF9900;"
            [@fadeInUp]
            title="AWS"
          ></i>
          <i
            class="devicon-react-original text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #61DAFB;"
            [@fadeInUp]
            title="React"
          ></i>
          <i
            class="devicon-typescript-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #3178C6;"
            [@fadeInUp]
            title="TypeScript"
          ></i>
          <i
            class="devicon-python-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #3776AB;"
            [@fadeInUp]
            title="Python"
          ></i>
          <i
            class="devicon-postgresql-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #336791;"
            [@fadeInUp]
            title="PostgreSQL"
          ></i>
          <i
            class="devicon-mongodb-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #47A248;"
            [@fadeInUp]
            title="MongoDB"
          ></i>
        </div>
        <!-- Second Row -->
        <div class="flex flex-wrap justify-center items-center gap-6 w-full max-w-5xl">
          <i
            class="devicon-nodejs-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #339933;"
            [@fadeInUp]
            title="Node.js"
          ></i>
          <i
            class="devicon-nginx-original text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #009639;"
            [@fadeInUp]
            title="Nginx"
          ></i>
          <i
            class="devicon-redis-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #DC382D;"
            [@fadeInUp]
            title="Redis"
          ></i>
          <i
            class="devicon-javascript-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #F7DF1E;"
            [@fadeInUp]
            title="JavaScript"
          ></i>
          <i
            class="devicon-angularjs-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #DD0031;"
            [@fadeInUp]
            title="Angular"
          ></i>
          <i
            class="devicon-vuejs-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #4FC08D;"
            [@fadeInUp]
            title="Vue.js"
          ></i>
          <i
            class="devicon-git-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #F05032;"
            [@fadeInUp]
            title="Git"
          ></i>
          <i
            class="devicon-bash-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #4EAA25;"
            [@fadeInUp]
            title="Bash"
          ></i>
          <i
            class="devicon-java-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #ED8B00;"
            [@fadeInUp]
            title="Java"
          ></i>
          <i
            class="devicon-cplusplus-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #00599C;"
            [@fadeInUp]
            title="C++"
          ></i>
          <i
            class="devicon-html5-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #E34F26;"
            [@fadeInUp]
            title="HTML5"
          ></i>
          <i
            class="devicon-css3-plain text-4xl transition-all duration-300 ease-in-out cursor-pointer transform hover:scale-110 hover:rotate-3"
            style="color: #1572B6;"
            [@fadeInUp]
            title="CSS3"
          ></i>
        </div>
      </div>

      <!-- CTA Buttons -->
      <div class="flex gap-4" [@fadeInUp]>
        <a
          routerLink="/projects"
          class="px-8 py-3 bg-purple-600 text-white rounded-full hover:bg-purple-700 transition-all duration-300 ease-in-out hover:scale-105 transform hover:shadow-xl hover:shadow-purple-500/50"
        >
          View Projects
        </a>
        <a
          href="https://linkedin.com/in/abdullah-al-sazib"
          target="_blank"
          class="px-8 py-3 border-2 border-purple-600 text-purple-600 dark:text-white rounded-full hover:bg-purple-600/20 transition-all duration-300 ease-in-out hover:scale-105 transform hover:shadow-lg hover:border-purple-700 dark:hover:border-purple-400"
        >
          Contact Me
        </a>
      </div>
    </div>
  </div>

  <!-- Social Media Sidebar -->
  <div
    class="fixed right-8 top-1/2 transform -translate-y-1/2 flex flex-col gap-6 z-20"
    [@fadeInRight]
  >
    <!-- <a href="https://www.facebook.com/abdullahalsazib22" target="_blank" rel="noopener noreferrer"
            class="text-2xl text-gray-600 hover:text-purple-500 dark:text-white dark:hover:text-purple-500 transition-colors">
            <i class="fab fa-facebook"></i>
        </a> -->
    <a
      href="https://www.github.com/abdullahalsazib"
      target="_blank"
      rel="noopener noreferrer"
      class="text-2xl text-gray-600 hover:text-purple-500 dark:text-white dark:hover:text-purple-500 transition-colors"
    >
      <i class="fab fa-github"></i>
    </a>
    <a
      href="https://linkedin.com/in/abdullah-al-sazib"
      target="_blank"
      rel="noopener noreferrer"
      class="text-2xl text-gray-600 hover:text-purple-500 dark:text-white dark:hover:text-purple-500 transition-colors"
    >
      <i class="fab fa-linkedin"></i>
    </a>
    <a
      href="https://www.instagram.com/abdullah_al_sazib"
      target="_blank"
      rel="noopener noreferrer"
      class="text-2xl text-gray-600 hover:text-purple-500 dark:text-white dark:hover:text-purple-500 transition-colors"
    >
      <i class="fab fa-instagram"></i>
    </a>
    <a
      href="https://telegram.me/abdullah404sazib"
      target="_blank"
      rel="noopener noreferrer"
      class="text-2xl text-gray-600 hover:text-purple-500 dark:text-white dark:hover:text-purple-500 transition-colors"
    >
      <i class="fab fa-telegram"></i>
    </a>
  </div>

  <!-- Bottom Corner Decorative Elements -->
  <div class="fixed left-0 bottom-0 z-10 opacity-30" [@fadeIn]>
    <div class="animate-float-slow transform rotate-12">
      <i
        class="fas fa-star text-4xl text-purple-500 absolute bottom-8 left-8"
      ></i>
      <i
        class="far fa-paper-plane text-3xl text-indigo-500 absolute bottom-16 left-16 rotate-45"
      ></i>
      <i
        class="fas fa-star text-2xl text-violet-500 absolute bottom-24 left-12"
      ></i>
    </div>
  </div>

  <div class="fixed right-0 bottom-0 z-10 opacity-30" [@fadeIn]>
    <div class="animate-float-slow transform -rotate-12">
      <i
        class="far fa-paper-plane text-4xl text-purple-500 absolute bottom-8 right-8 -rotate-45"
      ></i>
      <i
        class="fas fa-star text-3xl text-indigo-500 absolute bottom-16 right-16"
      ></i>
      <i
        class="far fa-paper-plane text-2xl text-violet-500 absolute bottom-24 right-12 rotate-90"
      ></i>
    </div>
  </div>
</main>
